<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Cửa hàng sách TKMT</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      /* Mẹo ép ô mật khẩu hiển thị dấu * thay vì dấu chấm đen theo prototype */
      .asterisk-password {
        -webkit-text-security: asterisk;
        -moz-text-security: asterisk;
      }
    </style>
  </head>
  <body class="bg-white min-h-screen flex items-center justify-center p-4">
    <!-- CARD ĐĂNG NHẬP (Màu nền #FFDFC3) -->
    <div
      class="bg-[#FFDFC3] rounded-[24px] w-full max-w-[540px] px-8 py-10 md:px-16 md:py-12 shadow-md relative"
    >
      <!-- LOGO CORNER -->
      <div class="flex justify-center mb-5">
        <div
          class="w-24 height-24 w-[92px] h-[92px] rounded-full border-4 border-[#1C3B5A] bg-white flex items-center justify-center overflow-hidden p-1"
        >
          <!-- Sử dụng trực tiếp ảnh logo từ hệ thống của bạn -->
          <img
            src="Images/logo.jpg"
            alt="Logo TKMT"
            class="w-full h-full object-contain"
          />
        </div>
      </div>

      <!-- TIÊU ĐỀ -->
      <h1
        class="text-center text-xl md:text-2xl font-bold text-[#1C3B5A] mb-6 tracking-wide"
      >
        Đăng nhập
      </h1>

      <!-- FORM GROUP: TÊN ĐĂNG NHẬP -->
      <div class="mb-4">
        <label
          class="block text-xs md:text-sm font-medium text-gray-700 mb-1.5"
          for="inp-user"
          >Tên đăng nhập</label
        >
        <input
          type="text"
          id="inp-user"
          class="block w-full h-11 px-4 bg-white border border-transparent rounded-lg text-sm text-gray-800 outline-none focus:border-[#FF8920] transition-all placeholder-gray-300"
          autocomplete="username"
          onkeydown="if (event.key === 'Enter') doLogin();"
        />
      </div>

      <!-- FORM GROUP: MẬT KHẨU -->
      <div class="mb-3">
        <label
          class="block text-xs md:text-sm font-medium text-gray-700 mb-1.5"
          for="inp-pass"
          >Mật khẩu</label
        >
        <div class="relative">
          <input
            type="password"
            id="inp-pass"
            class="asterisk-password block w-full h-11 pl-4 pr-10 bg-white border border-transparent rounded-lg text-sm text-gray-800 outline-none focus:border-[#FF8920] transition-all"
            autocomplete="current-password"
            onkeydown="if (event.key === 'Enter') doLogin();"
          />
          <!-- Lucide Icon mắt ẩn/hiện mật khẩu -->
          <button
            type="button"
            onclick="togglePassword()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none"
          >
            <i data-lucide="eye" id="eye-icon" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- ERROR MESSAGE (Đã đổi thành màu đỏ chuẩn prototype) -->
      <div class="min-h-[24px] mb-4 flex items-center justify-center">
        <span
          class="text-xs md:text-sm text-red-500 font-medium text-center hidden"
          id="error-msg"
        ></span>
      </div>

      <!-- BUTTON ĐĂNG NHẬP (Màu nền #FF8920) -->
      <button
        class="block w-full h-11 bg-[#FF8920] hover:bg-[#e27212] active:scale-[0.995] text-white rounded-lg text-sm md:text-base font-semibold tracking-wide transition-all shadow-sm"
        id="login-btn"
        onclick="doLogin()"
      >
        Đăng nhập
      </button>
    </div>

    <script>
      /* Khởi tạo thư viện Lucide Icons */
      lucide.createIcons();

      /* ── DỮ LIỆU NGƯỜI DÙNG GIẢ LẬP ── */
      const USERS = [
        {
          username: "admin",
          password: "admin123",
          role: "admin",
          name: "Admin",
          status: "active",
        },
        {
          username: "tccb",
          password: "tccb123",
          role: "tccb",
          name: "Trần Thị Hương",
          status: "active",
        },
        {
          username: "gv",
          password: "gv123",
          role: "employee",
          name: "Lê Văn An",
          status: "active",
        },
        {
          username: "locked",
          password: "locked123",
          role: "employee",
          name: "Người dùng bị khóa",
          status: "locked",
        },
      ];

      /* ── ẨN/HIỆN MẬT KHẨU VÀ ĐỔI ICON ── */
      function togglePassword() {
        const passwordInput = document.getElementById("inp-pass");
        const eyeIcon = document.getElementById("eye-icon");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          // Khi hiện text thì bỏ tạm thời class ép dấu asterisk đi
          passwordInput.classList.remove("asterisk-password");
          eyeIcon.setAttribute("data-lucide", "eye-off");
        } else {
          passwordInput.type = "password";
          passwordInput.classList.add("asterisk-password");
          eyeIcon.setAttribute("data-lucide", "eye");
        }
        // Re-render lại icon của lucide
        lucide.createIcons();
      }

      /* ── HIỂN THỊ / ẨN LỖI ── */
      function showError(msg) {
        const el = document.getElementById("error-msg");
        el.textContent = msg;
        el.classList.remove("hidden");
      }

      function hideError() {
        document.getElementById("error-msg").classList.add("hidden");
      }

      /* ── LOGIC XỬ LÝ ĐĂNG NHẬP ── */
      function doLogin() {
        const username = document.getElementById("inp-user").value.trim();
        const password = document.getElementById("inp-pass").value;
        hideError();

        if (!username || !password) {
          showError("Vui lòng nhập đầy đủ thông tin");
          return;
        }

        const user = USERS.find((u) => u.username === username);

        if (!user || user.password !== password) {
          showError("Tên đăng nhập hoặc mật khẩu không đúng");
          return;
        }

        if (user.status === "locked") {
          showError(
            "Tài khoản của bạn đã bị khóa. Vui lòng liên hệ Quản trị viên",
          );
          return;
        }

        // Lưu trạng thái session
        sessionStorage.setItem("currentUser", JSON.stringify(user));

        // Định tuyến trang
        const routes = {
          admin: "admin.html",
          tccb: "employee-office.html",
          employee: "employee.html",
        };
        const next = routes[user.role] || "dashboard.html";

        // Phản hồi nút bấm khi thành công
        const btn = document.getElementById("login-btn");
        btn.textContent = "✓ Đang vào hệ thống...";
        btn.style.background = "#16a34a"; // Chuyển xanh lá khi thành công
        btn.disabled = true;

        setTimeout(() => {
          window.location.href = next;
        }, 800);
      }

      /* Tự động ẩn thông báo lỗi khi người dùng gõ lại */
      ["inp-user", "inp-pass"].forEach((id) => {
        document.getElementById(id).addEventListener("input", hideError);
      });
    </script>
  </body>
</html>
